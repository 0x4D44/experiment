[package]
name = "typing-racer"
version = "1.0.0"
edition = "2021"
authors = ["Claude Code <noreply@anthropic.com>"]
description = "A fast-paced terminal typing speed racing game"
readme = "README.md"
repository = "https://github.com/anthropics/claude-code-games"

[dependencies]
crossterm = "0.27"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
dirs = "5.0"

[dev-dependencies]
tempfile = "3.8"

[[bin]]
name = "typing-racer"
path = "src/main.rs"

[lib]
name = "typing_racer"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1
