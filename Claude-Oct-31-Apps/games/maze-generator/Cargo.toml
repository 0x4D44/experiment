[package]
name = "maze-generator"
version = "1.0.0"
edition = "2021"
authors = ["Maze Generator Team"]
description = "A feature-rich command-line maze generator and solver with multiple algorithms"
license = "MIT"

[dependencies]
rand = "0.8"
crossterm = "0.28"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
criterion = "0.5"
proptest = "1.0"

[features]
default = ["serialization"]
serialization = ["serde", "serde_json"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
opt-level = 3
lto = true
