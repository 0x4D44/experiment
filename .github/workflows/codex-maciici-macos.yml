name: Codex Mac IIci macOS build

on:
  push:
    branches:
      - codex/maciici-bootstrap
    paths:
      - .github/workflows/codex-maciici-macos.yml
      - maciici-bootstrap/current.patch
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "10.15"

jobs:
  build:
    name: macOS Apple silicon app
    runs-on: macos-latest
    steps:
      - name: Checkout build inputs
        uses: actions/checkout@v4
        with:
          ref: codex/maciici-bootstrap
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github
            maciici-bootstrap

      - name: Clone exact Snow v1.5.0 source
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v1.5.0 https://github.com/twvd/snow.git snow
          test "$(git -C snow rev-parse HEAD)" = "317c188999dac854b3a8252d8a05adcaeeb3d589"

      - name: Apply Mac IIci patch
        run: |
          set -euxo pipefail
          git -C snow apply --check ../maciici-bootstrap/current.patch
          git -C snow apply ../maciici-bootstrap/current.patch
          git -C snow diff --check
          cargo fmt --manifest-path snow/Cargo.toml --all -- --check

      - name: Build Apple silicon release
        run: |
          set -euxo pipefail
          rustup target add aarch64-apple-darwin
          cargo build --manifest-path snow/Cargo.toml --release --locked --target aarch64-apple-darwin

      - name: Build and sign app bundle
        run: |
          set -euxo pipefail
          cd snow
          ./.github/mac-bundle.sh "$PWD/target/aarch64-apple-darwin/release/snowemu"
          codesign --force -s - -vvvv Snow.app
          mkdir -p ../package
          mv Snow.app ../package/Mac-IIci.app
          cp ../maciici-bootstrap/current.patch ../package/Mac-IIci-support.patch
          printf '%s\n' \
            'Macintosh IIci experimental build' \
            '=================================' \
            '' \
            'Apple-silicon macOS build of Snow v1.5.0 plus Mac IIci model support.' \
            'Control-click the app and choose Open if Gatekeeper blocks first launch.' \
            'Supply your own Macintosh IIci ROM and legal SCSI disk image.' \
            '' \
            'This is an experimental model-registration build, not proof of a completed' \
            'RBV-accurate System 6 or System 7 boot.' \
            > ../package/README.txt
          cd ../package
          ditto -c -k --sequesterRsrc --keepParent Mac-IIci.app Mac-IIci-macOS-Apple-Silicon.zip
          shasum -a 256 Mac-IIci-macOS-Apple-Silicon.zip > SHA256SUMS.txt

      - name: Upload macOS bundle
        uses: actions/upload-artifact@v4
        with:
          name: maciici-macos-apple-silicon
          path: package
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
