name: Sun 3/60 Gauntlet

on:
  push:
    branches:
      - codex/sun3-60-gauntlet
    paths:
      - "sun3-gauntlet/**"
      - ".bootstrap/source.b64.*"
      - ".bootstrap/patches/**"
      - ".github/workflows/sun3-gauntlet.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sun3-gauntlet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out gauntlet branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and preserve emulator source
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f sun3-gauntlet/Cargo.toml ]]; then
            cat .bootstrap/source.b64.* | base64 --decode > /tmp/sun3-source.tar.gz
            echo "1f27ecc5f984ea18ecddad1888cc420d1b648d6b43a29273f9dd09c0a7efdd7b  /tmp/sun3-source.tar.gz" | sha256sum --check
            tar -xzf /tmp/sun3-source.tar.gz
          fi

          shopt -s nullglob
          for patch in .bootstrap/patches/*.patch; do
            if git apply --check "$patch"; then
              git apply "$patch"
            elif git apply --reverse --check "$patch"; then
              echo "already applied: $patch"
            else
              echo "cannot apply patch: $patch" >&2
              exit 1
            fi
          done

          git config user.name "Sun 3/60 Gauntlet CI"
          git config user.email "sun3-gauntlet@users.noreply.github.com"
          git add sun3-gauntlet
          if ! git diff --cached --quiet; then
            git commit -m "sun3: materialize emulator source [skip ci]"
            git push origin HEAD:codex/sun3-60-gauntlet
          fi

      - name: Import pinned CPU core and genuine PROM
        working-directory: sun3-gauntlet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          ./scripts/bootstrap.sh 2>&1 | tee evidence/bootstrap.txt

      - name: Format and preserve rustfmt output
        working-directory: sun3-gauntlet
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git add crates Cargo.toml rust-toolchain.toml
          if ! git diff --cached --quiet; then
            git commit -m "sun3: apply rustfmt [skip ci]"
            git push origin HEAD:codex/sun3-60-gauntlet
          fi
          cargo fmt --all --check 2>&1 | tee evidence/fmt.txt

      - name: Clippy
        working-directory: sun3-gauntlet
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 | tee evidence/clippy.txt

      - name: Unit and architecture tests
        working-directory: sun3-gauntlet
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --all-features 2>&1 | tee evidence/tests.txt

      - name: Release build
        working-directory: sun3-gauntlet
        shell: bash
        run: |
          set -o pipefail
          cargo build --workspace --release 2>&1 | tee evidence/build.txt

      - name: Execute genuine PROM to interactive monitor
        id: prom
        continue-on-error: true
        working-directory: sun3-gauntlet
        shell: bash
        run: |
          set -o pipefail
          timeout 240 ./target/release/sun3 \
            --rom firmware/sun3-60-3.0.1.bin \
            --ram 24M \
            --headless \
            --console capture \
            --max-instructions 25000000 \
            --require-monitor \
            --script-cr \
            --trace-prom --trace-mmu --trace-io --trace-irq --trace-scc \
            --trace-file evidence/prom-trace.log \
            --console-log evidence/prom-console.bin \
            > evidence/prom-run.log 2>&1
          status=$?
          echo "exit_status=$status" | tee evidence/prom-status.txt
          exit "$status"

      - name: Package source, executable and evidence
        if: always()
        working-directory: sun3-gauntlet
        shell: bash
        run: |
          mkdir -p evidence
          cp target/release/sun3 evidence/sun3-linux-x86_64 || true
          tar \
            --exclude='./target' \
            --exclude='./vendor' \
            --exclude='./firmware' \
            --exclude='./evidence' \
            -czf evidence/sun3-gauntlet-source.tar.gz .
          sha256sum evidence/sun3-linux-x86_64 evidence/sun3-gauntlet-source.tar.gz \
            > evidence/artifact-sha256.txt 2>/dev/null || true

      - name: Upload evidence and build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sun3-gauntlet-build
          path: sun3-gauntlet/evidence/
          if-no-files-found: error
          retention-days: 14
