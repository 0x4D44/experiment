name: Codex Mac IIci hardware references

on:
  push:
    branches:
      - codex/maciici-bootstrap
    paths:
      - .github/workflows/codex-maciici-reference.yml

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch selected MAME reference sources
        run: |
          set -euxo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/mamedev/mame.git mame
          git -C mame sparse-checkout set --no-cone \
            /src/mame/apple/maciici.cpp \
            /src/mame/apple/rbv.cpp \
            /src/mame/apple/rbv.h \
            /src/devices/machine/pseudovia.cpp \
            /src/devices/machine/pseudovia.h
          git -C mame rev-parse HEAD > MAME_COMMIT
          mkdir out
          cp MAME_COMMIT out/
          cp --parents \
            mame/src/mame/apple/maciici.cpp \
            mame/src/mame/apple/rbv.cpp \
            mame/src/mame/apple/rbv.h \
            mame/src/devices/machine/pseudovia.cpp \
            mame/src/devices/machine/pseudovia.h out/
          sha256sum $(find out -type f | sort) > out/SHA256SUMS
      - name: Upload references
        uses: actions/upload-artifact@v4
        with:
          name: maciici-hardware-references
          path: out
          retention-days: 1
