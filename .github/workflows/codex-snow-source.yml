name: Codex Snow source publisher

on:
  push:
    branches:
      - codex/maciici-bootstrap
    paths:
      - .github/workflows/codex-snow-source.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publishing branch sparsely
        uses: actions/checkout@v4
        with:
          ref: codex/maciici-bootstrap
          path: publisher
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github
            maciici-bootstrap
      - name: Clone exact Snow release
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v1.5.0 https://github.com/twvd/snow.git snow
          git -C snow rev-parse HEAD | tee snow/UPSTREAM_COMMIT
          rm -rf snow/.git
          tar -czf snow-v1.5.0-source.tar.gz snow
          sha256sum snow-v1.5.0-source.tar.gz
      - name: Commit source archive to isolated branch
        run: |
          set -euxo pipefail
          mkdir -p publisher/maciici-bootstrap
          mv snow-v1.5.0-source.tar.gz publisher/maciici-bootstrap/
          cd publisher
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add maciici-bootstrap/snow-v1.5.0-source.tar.gz
          git commit -m 'Refresh Snow v1.5.0 source archive for Mac IIci build'
          git push origin HEAD:codex/maciici-bootstrap
      - name: Upload native transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: snow-source-bootstrap
          path: publisher/maciici-bootstrap/snow-v1.5.0-source.tar.gz
          retention-days: 1
          compression-level: 0
      - name: Publish stable release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          asset=publisher/maciici-bootstrap/snow-v1.5.0-source.tar.gz
          tag=maciici-bootstrap-source
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --target codex/maciici-bootstrap \
              --title 'Temporary Mac IIci source bootstrap' \
              --notes 'Snow v1.5.0 MIT-licensed source only. No Apple ROM or system software.'
          fi
