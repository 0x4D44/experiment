name: Codex Mac IIci iterative build

on:
  push:
    branches:
      - codex/maciici-bootstrap
    paths:
      - .github/workflows/codex-maciici-build.yml
      - maciici-bootstrap/current.patch
      - maciici-bootstrap/rbv-delta.patch.zlib.b85
      - maciici-bootstrap/smoke-fix.patch.zlib.b85
      - maciici-bootstrap/iici-post-fix.patch.zlib.b85
      - maciici-bootstrap/rbv-address-fix.patch
      - maciici-bootstrap/maciici_smoke.rs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout only build inputs
        uses: actions/checkout@v4
        with:
          ref: codex/maciici-bootstrap
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github
            maciici-bootstrap

      - name: Install Snow Linux prerequisites
        run: |
          set -euxo pipefail
          sudo apt-get -y update
          sudo apt-get -y install libasound2-dev python3

      - name: Decode implementation patches
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import base64
          import pathlib
          import zlib

          for source, output in [
              ("maciici-bootstrap/rbv-delta.patch.zlib.b85", "/tmp/maciici-rbv.patch"),
              ("maciici-bootstrap/smoke-fix.patch.zlib.b85", "/tmp/maciici-smoke-fix.patch"),
              ("maciici-bootstrap/iici-post-fix.patch.zlib.b85", "/tmp/maciici-post-fix.patch"),
          ]:
              encoded = pathlib.Path(source).read_bytes().strip()
              pathlib.Path(output).write_bytes(zlib.decompress(base64.b85decode(encoded)))
          PY
          test "$(sha256sum /tmp/maciici-rbv.patch | cut -d' ' -f1)" = "9be17fe2374b67a8eed6cdfb9cc553624ebc55055a952683b421e4a00c0745b8"
          test "$(sha256sum /tmp/maciici-smoke-fix.patch | cut -d' ' -f1)" = "1b6d7607df3cd865a54a9eb70b75b022638728955fdbb3b231c148321377af49"
          test "$(sha256sum /tmp/maciici-post-fix.patch | cut -d' ' -f1)" = "2452c798804c774c389f3dc3913520db05fcb455e459c4ba03f0324dcfdfaf61"
          test "$(sha256sum maciici-bootstrap/rbv-address-fix.patch | cut -d' ' -f1)" = "55f30498a69e24af9be27da4bf40e74c7395516c9e48661bcc6e688071f08a1a"

      - name: Clone exact Snow v1.5.0 source
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v1.5.0 https://github.com/twvd/snow.git snow
          test "$(git -C snow rev-parse HEAD)" = "317c188999dac854b3a8252d8a05adcaeeb3d589"

      - name: Apply and format Mac IIci implementation
        run: |
          set -euxo pipefail
          git -C snow apply --check ../maciici-bootstrap/current.patch
          git -C snow apply ../maciici-bootstrap/current.patch
          git -C snow apply --check /tmp/maciici-rbv.patch
          git -C snow apply /tmp/maciici-rbv.patch
          git -C snow apply --check /tmp/maciici-smoke-fix.patch
          git -C snow apply /tmp/maciici-smoke-fix.patch
          git -C snow apply --check /tmp/maciici-post-fix.patch
          git -C snow apply /tmp/maciici-post-fix.patch
          git -C snow apply --check ../maciici-bootstrap/rbv-address-fix.patch
          git -C snow apply ../maciici-bootstrap/rbv-address-fix.patch
          cp maciici-bootstrap/maciici_smoke.rs snow/testrunner/src/bin/maciici_smoke/main.rs
          cargo fmt --manifest-path snow/Cargo.toml --all
          git -C snow diff --check
          git -C snow diff > formatted-maciici.patch

      - name: Check complete workspace and all targets
        run: |
          set -euxo pipefail
          cd snow
          cargo check --workspace --all-targets --locked 2>&1 | tee ../workspace-check.log

      - name: Self-contained core tests
        run: |
          set -euxo pipefail
          cd snow
          # Snow's single-step CPU tests require a separate vector corpus that is
          # not shipped in the source release. Run every self-contained library test.
          cargo test -p snow_core --lib --locked -- --skip cpu_m68k::tests::singlestep 2>&1 | tee ../core-tests.log

      - name: Build headless tools
        run: |
          set -euxo pipefail
          cd snow
          cargo build -p testrunner --bin single --release --locked 2>&1 | tee ../headless-build.log
          cargo build -p testrunner --bin maciici_smoke --release --locked 2>&1 | tee ../smoke-build.log

      - name: Build graphical frontend
        run: |
          set -euxo pipefail
          cd snow
          cargo build -p snow_frontend_egui --bin snowemu --release --locked 2>&1 | tee ../frontend-build.log

      - name: Package build evidence
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p out
          cp workspace-check.log out/ 2>/dev/null || true
          cp core-tests.log out/ 2>/dev/null || true
          cp headless-build.log out/ 2>/dev/null || true
          cp smoke-build.log out/ 2>/dev/null || true
          cp frontend-build.log out/ 2>/dev/null || true
          cp formatted-maciici.patch out/ 2>/dev/null || true
          git -C snow diff > out/applied.patch 2>/dev/null || true
          git -C snow status --short > out/status.txt 2>/dev/null || true
          if [ -x snow/target/release/single ]; then cp snow/target/release/single out/; fi
          if [ -x snow/target/release/maciici_smoke ]; then cp snow/target/release/maciici_smoke out/; fi
          if [ -x snow/target/release/snowemu ]; then cp snow/target/release/snowemu out/; fi
          if [ -d snow ]; then
            rm -rf snow/.git snow/target
            tar -czf out/maciici-source.tar.gz snow
          fi
          sha256sum out/* > out/SHA256SUMS

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maciici-rbv-build
          path: out
          retention-days: 7
          compression-level: 0
