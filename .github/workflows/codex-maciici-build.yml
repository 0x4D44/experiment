name: Codex Mac IIci iterative build

on:
  push:
    branches:
      - codex/maciici-bootstrap
    paths:
      - .github/workflows/codex-maciici-build.yml
      - maciici-bootstrap/patch-parts/**
      - maciici-bootstrap/fix*.patch

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout only build inputs
        uses: actions/checkout@v4
        with:
          ref: codex/maciici-bootstrap
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github
            maciici-bootstrap

      - name: Reconstruct staged Mac IIci patch
        run: |
          set -euxo pipefail
          cat maciici-bootstrap/patch-parts/part*.b64 | base64 --decode > /tmp/maciici.patch
          test "$(sha256sum /tmp/maciici.patch | cut -d' ' -f1)" = "8dca77003af8963fb64d74fb2f12d1bfe83bb67c8af85fa4664e9f83e518f209"
          wc -c /tmp/maciici.patch

      - name: Clone exact Snow v1.5.0 source
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v1.5.0 https://github.com/twvd/snow.git snow
          test "$(git -C snow rev-parse HEAD)" = "317c188999dac854b3a8252d8a05adcaeeb3d589"

      - name: Apply and format Mac IIci implementation
        run: |
          set -euxo pipefail
          # The staged implementation was developed against rustfmt-normalised
          # v1.5.0 source. Normalise the exact upstream checkout before applying it.
          cargo fmt --manifest-path snow/Cargo.toml --all
          git -C snow apply --check /tmp/maciici.patch
          git -C snow apply /tmp/maciici.patch
          for fix in maciici-bootstrap/fix*.patch; do
            [ -e "$fix" ] || continue
            git -C snow apply --check "../$fix"
            git -C snow apply "../$fix"
          done
          cargo fmt --manifest-path snow/Cargo.toml --all
          git -C snow diff --check
          git -C snow diff > formatted-maciici.patch

      - name: Check complete workspace and all targets
        run: |
          set -euxo pipefail
          cd snow
          cargo check --workspace --all-targets --locked 2>&1 | tee ../workspace-check.log

      - name: Self-contained core tests
        run: |
          set -euxo pipefail
          cd snow
          # Snow's single-step CPU tests require a separate vector corpus that is
          # not shipped in the source release. Run every self-contained library test.
          cargo test -p snow_core --lib --locked -- --skip cpu_m68k::tests::singlestep 2>&1 | tee ../core-tests.log

      - name: Build headless test runner
        run: |
          set -euxo pipefail
          cd snow
          cargo build -p testrunner --bin single --release --locked 2>&1 | tee ../headless-build.log

      - name: Build graphical frontend
        run: |
          set -euxo pipefail
          cd snow
          cargo build -p snow_frontend_egui --bin snowemu --release --locked 2>&1 | tee ../frontend-build.log

      - name: Package build evidence
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p out
          cp workspace-check.log out/ 2>/dev/null || true
          cp core-tests.log out/ 2>/dev/null || true
          cp headless-build.log out/ 2>/dev/null || true
          cp frontend-build.log out/ 2>/dev/null || true
          cp formatted-maciici.patch out/ 2>/dev/null || true
          git -C snow diff > out/applied.patch 2>/dev/null || true
          git -C snow status --short > out/status.txt 2>/dev/null || true
          if [ -x snow/target/release/single ]; then cp snow/target/release/single out/; fi
          if [ -x snow/target/release/snowemu ]; then cp snow/target/release/snowemu out/; fi
          if [ -d snow ]; then
            rm -rf snow/.git snow/target
            tar -czf out/maciici-source.tar.gz snow
          fi
          sha256sum out/* > out/SHA256SUMS

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maciici-rbv-build
          path: out
          retention-days: 7
          compression-level: 0
